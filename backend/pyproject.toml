[project]
name = "jit-baseline"
version = "0.0.0"
description = "JIT defect prediction backend: collection, training, catalog and review API"
requires-python = ">=3.12"
readme = "README.md"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jit_baseline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["artifacts", "storage", "model-packages", ".venv", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
