name: VS Code extension package

on:
  pull_request:
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/vscode-extension-package.yml'
  push:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/vscode-extension-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install, test and package
        working-directory: vscode-extension
        shell: pwsh
        run: |
          npm ci
          npm test
          npm run package
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: jit-commit-analysis-vsix-${{ github.run_id }}
          path: vscode-extension/*.vsix
          if-no-files-found: error
