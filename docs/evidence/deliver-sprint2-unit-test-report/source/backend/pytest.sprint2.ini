[pytest]
pythonpath = .
addopts = -ra -p no:cacheprovider
          --cov=jit_baseline.data
          --cov=jit_baseline.metrics
          --cov=jit_baseline.splits
          --cov=jit_baseline.algorithms
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:../.cache/sprint2-unit/backend-coverage.json
          --cov-report=html:../.cache/sprint2-unit/backend-coverage
          --junitxml=../.cache/sprint2-unit/backend-junit.xml
