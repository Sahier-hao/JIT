        modelId:
          type: [string, 'null']
        runId:
          type: [string, 'null']
        featureSchemaVersion:
          type: [string, 'null']
        distributionRule:
          type: [string, 'null']
      required: [syncId, sourceKind, branch, since, until, commitLimit, createdAt, completedAt, headCommit, datasetVersion, modelId, runId, featureSchemaVersion, distributionRule]
