        start:
          $ref: '#/components/schemas/ProjectTrendDate'
        end:
          $ref: '#/components/schemas/ProjectTrendDate'
        commitCount:
          type: [integer, 'null']
          minimum: 0
        scoredCount:
          type: [integer, 'null']
          minimum: 0
        unknownCount:
          type: [integer, 'null']
          minimum: 0
        highCount:
          type: [integer, 'null']
          minimum: 0
        highRate:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        riskMean:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        rateReason:
          type: [string, 'null']
        coverage:
          type: string
          enum: [observed, unknown]
      required: [start, end, commitCount, scoredCount, unknownCount, highCount, highRate, riskMean, rateReason, coverage]
      allOf:
      - if:
          properties:
            coverage:
              const: unknown
        then:
          properties:
            commitCount:
              type: 'null'
            scoredCount:
              type: 'null'
            unknownCount:
              type: 'null'
            highCount:
              type: 'null'
            highRate:
              type: 'null'
            riskMean:
              type: 'null'
            rateReason:
              type: string
              minLength: 1
        else:
          properties:
            commitCount:
              type: integer
              minimum: 1
            scoredCount:
              type: integer
            unknownCount:
              type: integer
      - if:
          properties:
            scoredCount:
              type: integer
              maximum: 19
        then:
          properties:
            highRate:
              type: 'null'
            rateReason:
              type: string
              minLength: 1
    ProjectTrendView:
