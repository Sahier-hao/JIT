components:
  schemas:
    ProjectEvent:
      type: object
      additionalProperties: false
      properties:
        eventId:
          $ref: '#/components/schemas/Uuid'
        repositoryId:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum: [pr-discovered, pr-initial-summary, pr-updated, pr-closed, pr-merged, pr-analysis-ready, pr-analysis-failed]
        createdAt:
          type: string
          format: date-time
        title:
          type: string
        message:
          type: string
        owner:
          type: string
        name:
          type: string
        number:
          type: integer
          minimum: 1
        snapshotId:
          type: string
        syncId:
          type: string
        modelId:
          type: string
        isCurrent:
          type: boolean
          description: 读取时快照与自动跟踪模型仍匹配当前缓存，不冒充个人复核状态。
        discoveredCount:
          type: integer
          minimum: 0
        eligibleCount:
          type: integer
          minimum: 0
        maxDeepChecks:
          const: 20
        highScoreCount:
          type: integer
          minimum: 0
        scoredCount:
          type: integer
          minimum: 0
        totalCommits:
          type: integer
          minimum: 0
        coverageComplete:
          type: boolean
        filesComplete:
          type: boolean
        distributionRule:
          const: repo-distribution-v1
        errorCode:
          type: string
      required: [eventId, repositoryId, kind, createdAt, title, message]
      allOf:
      - if:
          properties:
            kind:
              const: pr-initial-summary
        then:
          required: [discoveredCount, eligibleCount, maxDeepChecks]
      - if:
          properties:
            kind:
              const: pr-analysis-ready
        then:
          required: [number, snapshotId, syncId, modelId, isCurrent, highScoreCount, scoredCount, totalCommits, coverageComplete, filesComplete, distributionRule]
      - if:
          properties:
            kind:
              const: pr-analysis-failed
        then:
          required: [number, snapshotId, modelId, errorCode]
      - if:
          properties:
            kind:
              enum: [pr-discovered, pr-updated, pr-closed, pr-merged]
        then:
          required: [number]
    ProjectEventPage:
      type: object
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ProjectEvent'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
      required: [events, total, limit, offset]
    ProjectPullRequest:
      type: object
      additionalProperties: false
      properties:
        number:
          type: integer
          minimum: 1
        title:
          type: string
        author:
          type: string
        url:
          type: string
          format: uri
        updatedAt:
          type: string
          format: date-time
        remoteState:
          type: string
          enum: [open, closed, merged]
        draft:
          type: boolean
        snapshotId:
          type: string
        analysisStatus:
          type: string
          enum: [pending, queued, running, backoff, completed, failed, cancelled, interrupted, superseded]
        modelId:
          type: string
        syncId:
          type: [string, 'null']
        maxRisk:
          type: number
          minimum: 0
          maximum: 1
        scoredCommits:
          type: integer
          minimum: 0
      required: [number, title, author, url, updatedAt, remoteState, draft]
    ProjectPullRequestPage:
      type: object
      additionalProperties: false
      properties:
        repositoryId:
          $ref: '#/components/schemas/Uuid'
        supported:
          type: boolean
        owner:
          type: string
        name:
          type: string
        pullRequests:
          type: array
          items:
            $ref: '#/components/schemas/ProjectPullRequest'
        page:
          type: integer
          minimum: 1
          maximum: 100
        hasMore:
          type: boolean
        checkedAt:
          type: [string, 'null']
          format: date-time
        publicOnly:
          const: true
        discoveryComplete:
          type: boolean
        errorCode:
          type: [string, 'null']
      required: [repositoryId, supported, pullRequests, page, hasMore, checkedAt, publicOnly, discoveryComplete]
      allOf:
      - if:
          properties:
            supported:
              const: true
        then:
          required: [owner, name]
    PRTrackingUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
        modelId:
          type: string
          minLength: 1
        intervalSeconds:
          type: integer
          minimum: 300
          maximum: 86400
        confirmExisting:
          type: boolean
          description: 首次开启必须显式为true；此前手动检查不替代此确认。
    PRTrackingState:
      type: object
      additionalProperties: false
      properties:
        repositoryId:
          $ref: '#/components/schemas/Uuid'
        supported:
          type: boolean
        enabled:
          type: boolean
        modelId:
          type: [string, 'null']
        intervalSeconds:
          type: integer
          minimum: 300
          maximum: 86400
        status:
          type: string
          enum: [idle, checking, unchanged, paused, error]
        lastCheckedAt:
          type: [string, 'null']
          format: date-time
        nextCheckAt:
          type: [string, 'null']
          format: date-time
        errorCode:
          type: [string, 'null']
        retryNotBefore:
          type: [string, 'null']
          format: date-time
        discoveryComplete:
          type: boolean
        initialScanComplete:
          type: boolean
        publicOnly:
          const: true
        maxDeepChecks:
          const: 20
        maxAutomaticQueued:
          const: 2
        openCachedCount:
          type: integer
          minimum: 0
        eligibleCachedCount:
          type: integer
          minimum: 0
        pendingCount:
          type: integer
          minimum: 0
        discoveryPage:
          type: integer
          minimum: 1
          maximum: 100
      required: [repositoryId, supported, enabled, modelId, intervalSeconds, status, lastCheckedAt, nextCheckAt, errorCode, retryNotBefore, discoveryComplete, initialScanComplete, publicOnly, maxDeepChecks, maxAutomaticQueued, openCachedCount, eligibleCachedCount, pendingCount, discoveryPage]
    ProjectTrendDate:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
    ProjectTrendCreate:
      type: object
      additionalProperties: false
      properties:
        groupId:
          type: string
          minLength: 1
        sourceSyncId:
          type: string
          minLength: 1
        start:
          $ref: '#/components/schemas/ProjectTrendDate'
        end:
          $ref: '#/components/schemas/ProjectTrendDate'
        grain:
