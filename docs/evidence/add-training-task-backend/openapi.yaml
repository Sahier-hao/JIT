      properties:
        repositoryId:
          $ref: '#/components/schemas/Uuid'
        viewId:
          $ref: '#/components/schemas/Uuid'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 200
        offset:
          type: integer
          minimum: 0
        commits:
