openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: JIT Review 产品接口文档
  version: 1.3.0
  description: 文档基线评审稿。API-01及提交／数据版本查询／数据来源、模型候选／登记／列表／schema／JSON预测／结果重开、仓库同步与仓库提交查询、仓库工作区视图已实现；其他操作仍是候选契约。字段例子为人工格式示例。当前API-01保持本机与既有响应；本文件不部署接口。全局错误码见../全局错误码表.md。
tags:
- name: 现有历史回放
- name: 目标共享产品
paths:
  /api/v1/project-events:
    get:
      operationId: listProjectEvents
      summary: 跨项目的持久站内事件
      description: 只返回公开来源与任务事实；已读、笔记和个人结论仍由当前浏览器保存。
      security: []
      tags: [目标共享产品]
      parameters:
      - $ref: '#/components/parameters/EventLimit'
      - $ref: '#/components/parameters/ProjectOffset'
      responses:
        '200':
          $ref: '#/components/responses/ProjectEvents'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/repositories/{repositoryId}/events:
    parameters:
    - $ref: '#/components/parameters/ProjectRepositoryId'
    get:
      operationId: listRepositoryEvents
      summary: 当前项目的持久站内事件
      security: []
      tags: [目标共享产品]
      parameters:
      - $ref: '#/components/parameters/EventLimit'
      - $ref: '#/components/parameters/ProjectOffset'
      responses:
        '200':
          $ref: '#/components/responses/ProjectEvents'
        '404':
          $ref: '#/components/responses/RepositoryUnknown'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/repositories/{repositoryId}/pull-requests:
    parameters:
    - $ref: '#/components/parameters/ProjectRepositoryId'
    - $ref: '#/components/parameters/ProjectPRState'
    - $ref: '#/components/parameters/ProjectPRPage'
    get:
      operationId: listRepositoryPullRequests
      summary: 读取项目已缓存的公开 PR 清单
      description: GET 不访问远端、不补建设置。checkedAt 是该页成功缓存时间；未缓存或不支持的项目诚实返回空页，不将缺页解释为 PR 已关闭。
      security: []
      tags: [目标共享产品]
      responses:
        '200':
          $ref: '#/components/responses/ProjectPullRequests'
        '404':
          $ref: '#/components/responses/RepositoryUnknown'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/repositories/{repositoryId}/pull-requests/refresh:
    parameters:
    - $ref: '#/components/parameters/ProjectRepositoryId'
    - $ref: '#/components/parameters/ProjectPRState'
    - $ref: '#/components/parameters/ProjectPRPage'
    post:
      operationId: refreshRepositoryPullRequests
      summary: 显式刷新项目公开 PR 清单的一页
      description: 服务端校验基项目与公开 GitHub 身份。远端失败返回保留的缓存及 errorCode，不将缓存失败伪装成新鲜完整清单；非 GitHub 返回 supported=false。
      security: []
      tags: [目标共享产品]
      responses:
        '200':
          $ref: '#/components/responses/ProjectPullRequests'
        '404':
          $ref: '#/components/responses/RepositoryUnknown'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/repositories/{repositoryId}/pull-requests/analyze:
    parameters:
    - $ref: '#/components/parameters/ProjectRepositoryId'
    post:
      operationId: analyzeRepositoryPullRequests
      summary: 为项目全部开放 PR 提交模型分析任务
      description: 读取每个开放 PR 的固定快照并创建分析任务；已有完成分析的 PR 跳过。后台逐个执行，进度通过 PR 清单的 analysisStatus 反映。可选 modelId 固定本次使用的真实兼容模型。
      security: []
      tags: [目标共享产品]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PRBatchAnalyzeRequest'
      responses:
        '200':
          description: 已排队的 PR 数量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRBatchAnalyze'
        '404':
          $ref: '#/components/responses/RepositoryUnknown'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/repositories/{repositoryId}/pull-requests/{number}/analyze:
    parameters:
    - $ref: '#/components/parameters/ProjectRepositoryId'
    - name: number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    post:
      operationId: analyzeRepositoryPullRequest
      summary: 为单个项目 PR 读取固定快照并创建模型分析
      description: 返回该快照的模型任务与已有分数；旧任务与新任务的来源边界按 PRAnalyses 说明。
      security: []
      tags: [目标共享产品]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PRBatchAnalyzeRequest'
      responses:
        '200':
          description: 当前响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRAnalyses'
        '404':
          $ref: '#/components/responses/RepositoryUnknown'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/repositories/{repositoryId}/pr-tracking:
    parameters:
    - $ref: '#/components/parameters/ProjectRepositoryId'
    get:
      operationId: getProjectPRTracking
      summary: 项目 PR 自动跟踪设置与实际检查状态
      security: []
      tags: [目标共享产品]
      responses:
        '200':
          $ref: '#/components/responses/PRTracking'
        '404':
          $ref: '#/components/responses/RepositoryUnknown'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
    patch:
      operationId: configureProjectPRTracking
      summary: 显式启停项目 PR 自动分析并固定模型
      description: 首次开启须 confirmExisting=true，确认分析当前开放非草稿 PR；旧项目默认关闭。暂停不取消已提交分析。模型身份固定，不随管理员默认切换；检查中不能切换模型。
      security: []
      tags: [目标共享产品]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PRTrackingUpdate'
      responses:
        '200':
          $ref: '#/components/responses/PRTracking'
        '404':
          $ref: '#/components/responses/RepositoryUnknown'
        '409':
          $ref: '#/components/responses/ProjectConflict'
        '413':
          $ref: '#/components/responses/InputLimitExceeded'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '502':
          $ref: '#/components/responses/RepositoryUnavailable'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/repositories/{repositoryId}/pr-tracking/check:
    parameters:
    - $ref: '#/components/parameters/ProjectRepositoryId'
    post:
      operationId: checkProjectPullRequests
      summary: 请求立即检查公开 PR，复用在途检查及限流等待
      description: 返回202与当前设置。未开启自动分析时仅刷新来源，不隐式开启；不支持的项目仍返回 supported=false，不提交分析。
      security: []
      tags: [目标共享产品]
      responses:
        '202':
          $ref: '#/components/responses/PRTracking'
        '404':
          $ref: '#/components/responses/RepositoryUnknown'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/repositories/{repositoryId}/trend-groups:
    parameters:
    - $ref: '#/components/parameters/ProjectRepositoryId'
    get:
      operationId: listProjectTrendGroups
      summary: 项目成功分支分析的可比口径
      description: 按项目、分支、模型及运行、特征 schema 和分档规则分组，不按 datasetVersion 切组。PR、用途未知和元数据不足的来源不参与跨分析拼接；创建时另行校验重叠观测冲突。
      security: []
      tags: [目标共享产品]
      responses:
        '200':
          description: 可比口径与固定来源候选
          headers:
            X-Request-Id:
              $ref: '#/components/headers/ProjectRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectTrendGroups'
        '404':
          $ref: '#/components/responses/RepositoryUnknown'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/repositories/{repositoryId}/trend-views:
    parameters:
    - $ref: '#/components/parameters/ProjectRepositoryId'
    post:
      operationId: createProjectTrendView
      summary: 准备可重开的固定项目趋势视图
      description: 同来源指纹与查询复用viewId，不复制分数。冲突拒绝整组；可显式 sourceSyncId 查看单次成功分支或旧unknown来源。默认UTC+08:00最近90天、周粒度，end右开，最多3660桶；仅一个可比组时可省略选择器。
      security: []
      tags: [目标共享产品]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectTrendCreate'
      responses:
        '200':
          $ref: '#/components/responses/ProjectTrend'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectConflict'
        '413':
          $ref: '#/components/responses/InputLimitExceeded'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/repositories/{repositoryId}/trend-views/{viewId}:
    parameters:
    - $ref: '#/components/parameters/ProjectRepositoryId'
    - $ref: '#/components/parameters/ProjectTrendViewId'
    get:
      operationId: getProjectTrendView
      summary: 读取已冻结来源的项目趋势
      description: 验证来源归属、存在性与内容指纹；删除或篡改报409 TREND_SOURCE_UNAVAILABLE，不替换来源。新分析只提示hasNewSources，不让正在阅读的视图漂移。数量仅表示保存分析覆盖，不代表完整仓库；未证明覆盖的空桶为null。
      security: []
      tags: [目标共享产品]
      responses:
        '200':
          $ref: '#/components/responses/ProjectTrend'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectConflict'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/repositories/{repositoryId}/trend-views/{viewId}/commits:
    parameters:
    - $ref: '#/components/parameters/ProjectRepositoryId'
    - $ref: '#/components/parameters/ProjectTrendViewId'
    get:
      operationId: listProjectTrendCommits
      summary: 固定来源和日期桶内的去重提交下钻
      description: risk降序、epoch降序、SHA升序，未评分排最后。日期只能缩小固定视图范围，start左闭、end右开；分页不引入后来分析或视图范围外的提交。
      security: []
      tags: [目标共享产品]
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - $ref: '#/components/parameters/ProjectOffset'
      - name: start
        in: query
        schema:
          $ref: '#/components/schemas/ProjectTrendDate'
      - name: end
        in: query
        schema:
          $ref: '#/components/schemas/ProjectTrendDate'
      responses:
        '200':
          description: 固定来源的风险排序分页
          headers:
            X-Request-Id:
              $ref: '#/components/headers/ProjectRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectTrendCommitPage'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectConflict'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/review-sources:
    post:
      operationId: preparePublicPRSource
      summary: 从公开 GitHub 仓库或 PR 接入真实工作
      description: 仅接收公开来源及列表参数。返回真实 PR 列表或固定快照；不接收个人意见、笔记或反馈。私有来源即使配置服务端令牌也拒绝。
      security: []
      tags:
      - 目标共享产品
      responses:
        '200':
          description: 当前响应
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PRPrepared'
                - $ref: '#/components/schemas/PRDiscovery'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '404':
          description: 公开来源或保存版本不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '409':
          description: 版本变化、原模型不可用或任务状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '429':
          description: GitHub 请求受限，保留旧来源并允许重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '502':
          description: GitHub 来源不可读取
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                url:
                  type: string
                  format: uri
                state:
                  type: string
                  enum:
                  - open
                  - closed
                  - all
                  default: open
                page:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 1
              required:
              - url
  /api/v1/pr-sources/{owner}/{name}/{number}/refresh:
    post:
      operationId: refreshPublicPR
      summary: 检查 PR 基准、目标和远端状态
      description: 相同代码身份复用保存快照；新版本独立保存。继承关系不可读取时明确 unknown，失败不修改旧来源。可指定已登记基项目，服务端校验其与 PR 目标仓库身份一致，不为 fork 新建项目。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                repositoryId:
                  $ref: '#/components/schemas/Uuid'
      security: []
      tags:
      - 目标共享产品
      responses:
        '200':
          description: 当前响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRPrepared'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '404':
          description: 公开来源或保存版本不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '409':
          description: 版本变化、原模型不可用或任务状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '429':
          description: GitHub 请求受限，保留旧来源并允许重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '502':
          description: GitHub 来源不可读取
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: number
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
  /api/v1/pr-snapshots/{snapshotId}:
    get:
      operationId: getPRSnapshot
      summary: 读取不可变 PR 来源快照
      description: ''
      security: []
      tags:
      - 目标共享产品
      responses:
        '200':
          description: 当前响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRSourceSnapshot'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '404':
          description: 公开来源或保存版本不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '409':
          description: 版本变化、原模型不可用或任务状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '429':
          description: GitHub 请求受限，保留旧来源并允许重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '502':
          description: GitHub 来源不可读取
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
      parameters:
      - name: snapshotId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
  /api/v1/pr-snapshots/{snapshotId}/context:
    get:
      operationId: getPRFileContext
      summary: 读取固定 SHA 的文件上下文
      description: 文件必须属于此快照；按对应仓库、原路径和固定 SHA 读取。不存在侧单独标明，二进制、过大或不可解码内容返回明确错误；超长文本声明未完整覆盖。
      security: []
      tags:
      - 目标共享产品
      responses:
        '200':
          description: 当前响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRFileContext'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '404':
          description: 公开来源或保存版本不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '409':
          description: 版本变化、原模型不可用或任务状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '429':
          description: GitHub 请求受限，保留旧来源并允许重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '502':
          description: GitHub 来源不可读取
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
      parameters:
      - name: snapshotId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: path
        in: query
        required: true
        schema:
          type: string
      - name: side
        in: query
        required: false
        schema:
          type: string
          enum:
          - base
          - head
          default: head
  /api/v1/pr-snapshots/{snapshotId}/analyses:
    get:
      operationId: getPRModelClues
      summary: 读取该固定版本的模型任务与已覆盖提交分数
      description: 只读保存结果；不加载模型。只有成功任务的实际 HEAD 等于快照目标才返回分数，缺失条目不计为低风险。
      security: []
      tags:
      - 目标共享产品
      responses:
        '200':
          description: 当前响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRAnalyses'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '404':
          description: 公开来源或保存版本不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '409':
          description: 版本变化、原模型不可用或任务状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '429':
          description: GitHub 请求受限，保留旧来源并允许重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '502':
          description: GitHub 来源不可读取
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
      parameters:
      - name: snapshotId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      operationId: createPRModelClues
      summary: 主动创建绑定 PR HEAD 的现成模型分析
      description: 指定真实兼容模型或在任务创建时绑定管理员默认模型。原任务复用、失败恢复及模型准入沿用分析服务；不生成 PR 整体缺陷概率，不接收个人记录。
      security: []
      tags:
      - 目标共享产品
      responses:
        '200':
          description: 当前响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRAnalyses'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '404':
          description: 公开来源或保存版本不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '409':
          description: 版本变化、原模型不可用或任务状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '429':
          description: GitHub 请求受限，保留旧来源并允许重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '502':
          description: GitHub 来源不可读取
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
      parameters:
