          minimum: 0
        highCount:
          type: [integer, 'null']
          minimum: 0
        highRate:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        riskMean:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        rateReason:
          type: [string, 'null']
      required: [commitCount, scoredCount, unknownCount, highCount, highRate, riskMean, rateReason]
