    PRAnalyses:
      type: object
      additionalProperties: false
      properties:
        snapshotId:
          $ref: '#/components/schemas/Uuid'
        analyses:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              sync:
                $ref: '#/components/schemas/RepositorySyncView'
              contextValid:
                type: boolean
                description: 按 bindingKind 对应口径核对保存任务；历史口径为true不表示已证明新任务的完整快照及模型绑定，须同时阅读bindingLimitations。
              bindingKind:
                type: string
                enum: [snapshot-model-v1, legacy-head-v1]
                description: 新任务按固定快照、模型及实际HEAD严格绑定；legacy-head-v1仅表示迁移冻结的历史关联与保存HEAD可核对，不补分或重算。
              bindingLimitations:
                type: array
                items:
                  type: string
                description: 历史关联尚未冻结的来源或模型上下文限制；不能把旧HEAD结果宣称为具备新任务的完整绑定证明。
              coverageComplete:
                type: boolean
                description: 固定 PR 提交列表完整、按声明的bindingKind核对上下文有效且全部提交已有保存评分；不消除bindingLimitations中的历史证明限制。
              scoredCommits:
                type: integer
                minimum: 0
              totalCommits:
                type: integer
                minimum: 0
              scores:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    commitId:
                      type: string
                    risk:
                      type: number
                      minimum: 0
                      maximum: 1
                    files:
                      type: array
                      items:
                        type: string
                    addedLines:
                      type: integer
                      minimum: 0
                    deletedLines:
                      type: integer
                      minimum: 0
                    fileCount:
                      type: integer
                      minimum: 0
                  required:
                  - commitId
                  - risk
                  - files
                  - addedLines
                  - deletedLines
                  - fileCount
              fileRisks:
                type: array
                description: 该分析中 PR 提交触达的文件及其最高提交分数；仅用于排序参考，不是文件级缺陷概率。
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    path:
                      type: string
                    risk:
                      type: number
                      minimum: 0
                      maximum: 1
                  required:
                  - path
                  - risk
            required:
            - sync
            - contextValid
            - bindingKind
            - bindingLimitations
            - coverageComplete
            - scoredCommits
            - totalCommits
            - scores
            - fileRisks
      required:
      - snapshotId
      - analyses
