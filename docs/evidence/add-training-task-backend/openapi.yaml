          minLength: 1
        datasetVersion:
          type: string
          minLength: 1
        inputSha256:
          $ref: '#/components/schemas/Hash'
        sourceKind:
          type: string
          enum:
          - client-features
          - persisted-commit
        records:
          type: array
          items:
            $ref: '#/components/schemas/PredictionRecord'
          minItems: 1
          maxItems: 1
        limitations:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        createdAt:
          type: string
          format: date-time
      required:
      - mode
      - batchId
      - project
      - runId
      - model
      - featureSchemaVersion
      - inputSha256
      - sourceKind
      - records
      - limitations
      - createdAt
      additionalProperties: false
    Contribution:
      type: object
      properties:
        feature:
          type: string
          minLength: 1
        rawValue:
          type:
          - number
          - boolean
        contribution:
          type: number
        direction:
          type: string
          enum:
          - increase
          - decrease
          - neutral
      required:
      - feature
      - rawValue
      - contribution
      - direction
      additionalProperties: false
    Explanation:
      type: object
      properties:
        predictionId:
          $ref: '#/components/schemas/Uuid'
        modelId:
          $ref: '#/components/schemas/Uuid'
        runId:
          $ref: '#/components/schemas/Uuid'
        featureSchemaVersion:
          type: string
          minLength: 1
        state:
          type: string
          enum:
          - pending
          - ready
          - failed
        method:
          type:
          - string
          - 'null'
        backgroundHash:
          oneOf:
          - $ref: '#/components/schemas/Hash'
          - type: 'null'
        baseValue:
          type:
          - number
          - 'null'
        unit:
          type:
          - string
          - 'null'
        contributions:
          type: array
          items:
            $ref: '#/components/schemas/Contribution'
          minItems: 0
        error:
          oneOf:
          - type: object
            properties:
              code:
                $ref: '#/components/schemas/GlobalErrorCode'
              message:
                type: string
                minLength: 1
            required:
            - code
            - message
            additionalProperties: false
          - type: 'null'
      required:
      - predictionId
      - modelId
      - runId
      - featureSchemaVersion
      - state
      - method
      - backgroundHash
      - baseValue
      - unit
      - contributions
      - error
      additionalProperties: false
      allOf:
      - if:
          properties:
            state:
              const: ready
        then:
          properties:
            method:
              type: string
              minLength: 1
            backgroundHash:
              $ref: '#/components/schemas/Hash'
            baseValue:
              type: number
            unit:
              type: string
              minLength: 1
            contributions:
              type: array
              items:
                $ref: '#/components/schemas/Contribution'
              minItems: 1
            error:
              type: 'null'
      - if:
          properties:
            state:
              const: failed
        then:
          properties:
            error:
              type: object
              properties:
                code:
                  $ref: '#/components/schemas/GlobalErrorCode'
                message:
                  type: string
                  minLength: 1
              required:
              - code
              - message
              additionalProperties: false
    ComparisonEntry:
      type: object
      properties:
        runId:
          $ref: '#/components/schemas/Uuid'
        method:
          type: string
          minLength: 1
        metrics:
          $ref: '#/components/schemas/RunMetrics'
      required:
      - runId
      - method
      - metrics
      additionalProperties: false
    Comparison:
      type: object
      properties:
        comparisonKey:
          $ref: '#/components/schemas/Hash'
        datasetVersion:
          $ref: '#/components/schemas/Uuid'
        featureSchemaVersion:
          type: string
          minLength: 1
        protocolVersion:
          type: string
          minLength: 1
        runs:
          type: array
          items:
            $ref: '#/components/schemas/ComparisonEntry'
          minItems: 2
        limitations:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
      required:
      - comparisonKey
      - datasetVersion
      - featureSchemaVersion
      - protocolVersion
      - runs
      - limitations
      additionalProperties: false
    TrendPoint:
      type: object
      properties:
        periodStart:
          type: string
          format: date
        records:
          type: integer
          minimum: 0
        observedLabels:
          type: integer
          minimum: 0
        positiveLabels:
          type: integer
          minimum: 0
        unknownLabels:
          type: integer
          minimum: 0
        observedPositiveRate:
          $ref: '#/components/schemas/MetricScore'
        meanRisk:
          $ref: '#/components/schemas/MetricScore'
      required:
      - periodStart
      - records
      - observedLabels
      - positiveLabels
      - unknownLabels
      - observedPositiveRate
      - meanRisk
      additionalProperties: false
    Trend:
      type: object
      properties:
        runId:
          $ref: '#/components/schemas/Uuid'
        datasetVersion:
          $ref: '#/components/schemas/Uuid'
        bucket:
          type: string
          enum:
          - day
          - week
          - month
        timezone:
          const: Asia/Shanghai
        points:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
          minItems: 0
        limitations:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
      required:
      - runId
      - datasetVersion
      - bucket
      - timezone
      - points
      - limitations
      additionalProperties: false
    ExperimentReport:
      type: object
      properties:
        run:
          $ref: '#/components/schemas/ExperimentRun'
        source:
          type: object
        manifestSha256:
          $ref: '#/components/schemas/Hash'
        generatedAt:
          type: string
          format: date-time
        attempts:
          type: array
          items:
            type: object
            properties:
              attemptId:
                $ref: '#/components/schemas/Uuid'
              state:
                type: string
                enum:
                - queued
                - running
                - succeeded
                - failed
              error:
                oneOf:
                - type: object
                  properties:
                    code:
                      $ref: '#/components/schemas/GlobalErrorCode'
                    message:
                      type: string
                      minLength: 1
                  required:
                  - code
                  - message
                  additionalProperties: false
                - type: 'null'
            required:
            - attemptId
            - state
            - error
            additionalProperties: false
          minItems: 0
        limitations:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
      required:
      - run
      - source
      - manifestSha256
      - generatedAt
      - attempts
      - limitations
      additionalProperties: false
    TrainingTaskCreate:
      type: object
      properties:
        datasetVersion:
          type: string
          minLength: 1
        method:
          type: string
          enum:
          - logistic-regression-l2-v1
          - decision-tree-v1
          - random-forest-v1
          - gaussian-naive-bayes-v1
          - gradient-boosting-v1
          - mlp-v1
          - tabular-resnet-v1
          - ft-transformer-v1
          - wide-deep-v1
        metricSet:
          type: string
          enum: [metric-set-v1, metric-set-v2]
          default: metric-set-v2
      required: [datasetVersion, method]
      additionalProperties: false
    TrainingTaskView:
      type: object
      properties:
        taskId:
          $ref: '#/components/schemas/Uuid'
        datasetVersion:
          type: string
        datasetManifest:
          type: string
        manifestSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        method:
          type: string
        metricSet:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled, interrupted]
        stage:
          type: string
          enum: [queued, training, completed, failed, cancelled, interrupted]
        error:
          oneOf:
          - type: 'null'
          - type: object
            properties:
              code: {type: string, minLength: 1}
              message: {type: string, minLength: 1}
            required: [code, message]
            additionalProperties: false
        parentTaskId:
          type: [string, 'null']
          format: uuid
        createdBy:
          type: string
        requestId:
          type: [string, 'null']
        artifactKey:
          type: [string, 'null']
        artifactRunId:
          type: [string, 'null']
        runId:
          type: [string, 'null']
          format: uuid
        modelId:
          type: [string, 'null']
          format: uuid
        featureSchemaVersion:
          type: [string, 'null']
        metrics:
          type: [object, 'null']
        createdAt: {type: string, minLength: 1}
        updatedAt: {type: string, minLength: 1}
        startedAt: {type: [string, 'null']}
        deadlineAt: {type: [string, 'null']}
        cancelRequestedAt: {type: [string, 'null']}
        completedAt: {type: [string, 'null']}
        queuePosition: {type: [integer, 'null'], minimum: 1}
      required:
      - taskId
      - datasetVersion
      - datasetManifest
      - manifestSha256
      - method
      - metricSet
      - status
      - stage
      - error
      - parentTaskId
      - createdBy
      - requestId
      - artifactKey
      - artifactRunId
      - runId
      - modelId
      - featureSchemaVersion
      - metrics
      - createdAt
      - updatedAt
      - startedAt
      - deadlineAt
      - cancelRequestedAt
      - completedAt
      - queuePosition
      additionalProperties: false
    TrainingTaskPage:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TrainingTaskView'
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
      required: [tasks, total, limit, offset]
      additionalProperties: false
    DatasetImportForm:
      type: object
      properties:
        descriptor:
          $ref: '#/components/schemas/DatasetDescriptor'
        file:
          type: string
          format: binary
      required:
      - descriptor
      - file
      additionalProperties: false
    PredictionCsvForm:
      type: object
      properties:
        modelId:
          $ref: '#/components/schemas/Uuid'
        featureSchemaVersion:
          type: string
          enum:
          - openstack-six-v1
          - kamei14-v1
        project:
          type: string
          minLength: 1
        file:
          type: string
          format: binary
      required:
      - modelId
      - featureSchemaVersion
      - project
      - file
      additionalProperties: false
  headers:
    ProjectRequestId:
      description: 服务端为本次请求分配的诊断标识；标准错误中的 requestId 与其一致。
      schema:
        type: string
        minLength: 1
  parameters:
    ProjectRepositoryId:
      name: repositoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ProjectTrendViewId:
      name: viewId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    EventLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ProjectOffset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    ProjectPRState:
      name: state
      in: query
      schema:
        type: string
        enum: [open, closed, all]
        default: open
    ProjectPRPage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 1
  responses:
    ProjectEvents:
      description: 公开项目与PR事件的固定引用，不包含个人记录；当前性在读取时重新核对。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/ProjectRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectEventPage'
    ProjectPullRequests:
      description: 当前项目已缓存的PR页与成功检查时间，远端刷新失败时保留旧缓存并附errorCode。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/ProjectRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectPullRequestPage'
    PRTracking:
      description: PR自动跟踪的持久设置、检查状态与覆盖范围；不代表分析已成功。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/ProjectRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PRTrackingState'
    ProjectTrend:
      description: 固定manifest下的项目已分析提交趋势与可追溯来源，不代表仓库真实缺陷率。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/ProjectRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectTrendView'
    ProjectConflict:
      description: TREND_SOURCE_CONFLICT、TREND_SOURCE_UNAVAILABLE、MODEL_DISABLED、DEFAULT_MODEL_REQUIRED 或 CONFLICT_ACTIVE_SYNC；原有固定结果不被替换。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/ProjectRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    CurrentUnavailable:
      description: 当前Snapshot加载失败，无旧或部分批次。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentError'
    CurrentInferenceFailure:
      description: 当前实际模型推理失败，无批次。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentError'
    NotFound:
      description: 资源标识不存在。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/ProjectRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    AdminRequired:
      description: 需要有效管理员会话；不返回维护数据。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/ProjectRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    TrainingConflict:
      description: 训练任务已结束、不可重试或当前状态不允许该操作；原任务保持不变。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/ProjectRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    RepositoryUnknown:
      description: 仓库标识不存在（`REPOSITORY_UNKNOWN`）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/ProjectRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    InputInvalid:
      description: 输入、hash、schema或数值不合法。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/ProjectRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    InputLimitExceeded:
      description: 请求大小、行数或趋势分桶数量超过上限。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/ProjectRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    ContextMismatch:
      description: 运行比较／版本上下文不一致；planned契约。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    ModelUnavailable:
      description: 模型不ready或产物不可用；planned契约。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    RunNotReady:
      description: 完整成功运行不可用；planned契约。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    InferenceFailure:
      description: 实际推理异常或输出非法；planned契约。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    StorageUnavailable:
      description: 数据目录未初始化或数据库不可用；当前实现返回 503 STORAGE_UNAVAILABLE。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/ProjectRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    RepositoryUnavailable:
      description: 仓库不可达、分支不存在或克隆失败；当前实现返回 502 REPOSITORY_UNAVAILABLE。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/ProjectRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: jit_admin_session
x-source-date: '2026-10-12'
