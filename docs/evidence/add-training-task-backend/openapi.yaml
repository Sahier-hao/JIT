  /api/v1/repositories/{repositoryId}/comparison:
    get:
      operationId: compareSavedRepositoryAnalyses
      summary: 对照同一项目两次固定成功分析的保存分数与度量
      description: 不加载模型或读取标签、不重新推理。两次分析必须明确、不同且属于本项目；结果为共同提交和各侧覆盖的并集。不同模型分数差异不表示质量提升，单侧覆盖不表示代码新增或删除。
      x-implementation-status: implemented
      security: []
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: baseSyncId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: targetSyncId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 200, default: 20}
      - name: offset
        in: query
        schema: {type: integer, minimum: 0, default: 0}
      - name: change
        in: query
        schema: {enum: [all, added, removed, changed, unchanged], default: all}
      responses:
        '200':
          description: 两侧来源、全局覆盖计数和确定排序的筛选分页。changed 优先，其后按分数差绝对值和提交标识排序。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisComparison'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: REPOSITORY_ANALYSIS_UNAVAILABLE，某侧尚未成功。
        '422':
          $ref: '#/components/responses/InputInvalid'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
