openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info: {title: JIT Review 产品接口文档, version: 1.1.0, description: 文档基线评审稿。API-01及模型候选／登记／列表／schema／JSON预测／结果重开已实现；其他操作仍是候选契约。字段例子为人工格式示例。当前API-01保持本机与既有响应；本文件不部署接口。全局错误码见../全局错误码表.md。}
tags:
- {name: 现有历史回放}
- {name: 目标共享产品}
