            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersions'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '401':
          description: Administrator session required; no maintenance data is returned.
      description: 当前后端操作；本机使用，无需凭据。数据集名取 `/api/v1/datasets` 返回的 `dataset` 字段。
      security:
      - AdminSession: []
  /api/v1/datasets/import:
    post:
      operationId: importDataset
      summary: 注册并校验公开CSV数据
      tags:
      - 目标共享产品
      x-api-id: API-03
      x-user-stories:
      - US-01
      - US-02
      - US-03
      - US-23
      x-implementation-status: planned
      responses:
        '201':
          description: 候选成功响应，尚未实现
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetImportResult'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '413':
          $ref: '#/components/responses/InputLimitExceeded'
        '401':
          description: Administrator session required; no maintenance data is returned.
      x-auth-status: proposed
      x-access-policy: write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DatasetImportForm'
            encoding:
              file:
                contentType: text/csv
              descriptor:
                contentType: application/json
      x-proposed-limits:
        maxBytes: 52428800
        maxRows: 100000
      description: 候选50MiB／100000条。全部原始行先校验，来源hash不匹配不能ready；相同版本复用，不任意抓取descriptor URL。
      security:
      - AdminSession: []
  /api/v1/datasets/versions/{datasetVersion}/quality:
    get:
