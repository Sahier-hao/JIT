openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: JIT Review 产品接口文档
  version: 1.3.0
  description: 文档基线评审稿。API-01及提交／数据版本查询／数据来源、模型候选／登记／列表／schema／JSON预测／结果重开、仓库同步与仓库提交查询、仓库工作区视图已实现；其他操作仍是候选契约。字段例子为人工格式示例。当前API-01保持本机与既有响应；本文件不部署接口。全局错误码见../全局错误码表.md。
tags:
- name: 现有历史回放
- name: 目标共享产品
paths:
  /api/review-batch:
    get:
      operationId: getHistoricalReviewBatch
      summary: 当前固定六字段真实历史批次
      tags:
      - 现有历史回放
      x-api-id: API-01
      x-user-stories:
      - US-10
      - US-11
      - US-12
      - US-13
      - US-14
      - US-15
      - US-17
      - US-18
      - US-19
      x-implementation-status: implemented
      responses:
        '200':
          description: 当前成功响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalBatch'
          headers:
            Cache-Control:
              description: 当前服务成功响应不缓存
              schema:
                const: no-store
        '503':
          $ref: '#/components/responses/CurrentUnavailable'
        '500':
          $ref: '#/components/responses/CurrentInferenceFailure'
        '401':
          description: Administrator session required; no maintenance data is returned.
      description: 仅本机、无鉴权、实际调用已加载模型，不读取逐条评价标签。当前服务关闭Swagger／OpenAPI地址，此文档不改变运行行为。
      security:
      - AdminSession: []
  /api/v1/commits:
    get:
      operationId: listCommits
      summary: 提交级数据分页列表
      tags:
      - 目标共享产品
      x-api-id: API-18
      x-user-stories:
      - US-01
      - US-23
      x-implementation-status: implemented
      x-auth-status: implemented
      x-access-policy: read
      parameters:
      - name: version
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: module
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: 当前响应，列表项只含摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitPage'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InputInvalid'
        '401':
          description: Administrator session required; no maintenance data is returned.
      description: 列表项为 commitId／authorTime／label／module，不返回特征。limit 越界（0、501、负数、非整数）返回 422 INPUT_INVALID，不静默截断；未知
        version 返回 404。
      security:
      - AdminSession: []
  /api/v1/commits/{commitId}:
    get:
      operationId: getCommit
      summary: 单条提交的完整特征
      tags:
      - 目标共享产品
      x-api-id: API-19
      x-user-stories:
      - US-01
      - US-23
      x-implementation-status: implemented
      x-auth-status: implemented
      x-access-policy: read
      parameters:
      - name: commitId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: version
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: 当前响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Administrator session required; no maintenance data is returned.
      description: 未知提交或未知版本返回 404，不返回空对象。
      security:
      - AdminSession: []
  /api/v1/datasets:
    get:
      operationId: listDatasets
      summary: 已登记数据来源与版本列表
      tags:
      - 目标共享产品
      x-api-id: API-02
      x-user-stories:
      - US-01
      - US-23
      x-implementation-status: implemented
      x-auth-status: implemented
      x-access-policy: member-or-admin
      responses:
        '200':
          description: 当前响应；按数据集名分组，组内按版本名排序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetRegistry'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '401':
          description: Administrator session required; no maintenance data is returned.
      description: 当前后端操作；本机使用，无需凭据。内容来自 backend/data/datasets 下描述文件的登记结果，只含版本与质量摘要，不含提交级数据。
      security:
      - AdminSession: []
