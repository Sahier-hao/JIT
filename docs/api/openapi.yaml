    PredictionCreate:
      type: object
      properties:
        modelId:
          $ref: '#/components/schemas/Uuid'
        featureSchemaVersion:
          const: openstack-six-v1
        project:
          type: string
          minLength: 1
          maxLength: 128
        record:
          $ref: '#/components/schemas/FeatureInputRecord'
      required:
      - modelId
      - featureSchemaVersion
      - project
      - record
      additionalProperties: false
      description: 单条原始六字段 JSON，最多 64 KiB；计数严格整数，拒绝布尔／字符串／重复属性，元数据时间必须带时区。
    PredictionRecord:
      type: object
      properties:
        predictionId:
          $ref: '#/components/schemas/Uuid'
        recordId:
          type: string
          minLength: 1
        commitId:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{40}$
        time:
          type:
          - string
          - 'null'
          format: date-time
        risk:
          type: number
          minimum: 0
          maximum: 1
        features:
          $ref: '#/components/schemas/SixFeatures'
        explanationStatus:
          const: not-supported
        explanationReason:
          type: string
          minLength: 1
      required:
      - predictionId
      - recordId
      - commitId
      - time
      - risk
      - features
      - explanationStatus
      - explanationReason
      additionalProperties: false
    PredictionBatch:
      type: object
      properties:
        mode:
          type: string
          enum: [feature-input, persisted-commit]
        batchId:
          $ref: '#/components/schemas/Uuid'
        project:
          type: string
          minLength: 1
        runId:
          $ref: '#/components/schemas/Uuid'
        model:
          allOf:
          - $ref: '#/components/schemas/ModelInfo'
          - properties:
              state:
                const: ready
        featureSchemaVersion:
          type: string
          minLength: 1
        datasetVersion:
          type: string
          minLength: 1
        inputSha256:
          $ref: '#/components/schemas/Hash'
        sourceKind:
          type: string
          enum: [client-features, persisted-commit]
        records:
          type: array
          items:
            $ref: '#/components/schemas/PredictionRecord'
          minItems: 1
          maxItems: 1
        limitations:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
