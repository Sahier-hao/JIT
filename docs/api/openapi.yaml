      additionalProperties: false
      allOf:
      - if:
          properties:
            state: {const: ready}
        then:
          properties:
            method: {type: string, minLength: 1}
            backgroundHash: {$ref: '#/components/schemas/Hash'}
            baseValue: {type: number}
            unit: {type: string, minLength: 1}
            contributions:
              type: array
              items: {$ref: '#/components/schemas/Contribution'}
              minItems: 1
            error: {type: 'null'}
      - if:
          properties:
            state: {const: failed}
        then:
          properties:
            error:
              type: object
              properties:
                code: {$ref: '#/components/schemas/GlobalErrorCode'}
                message: {type: string, minLength: 1}
              required: [code, message]
              additionalProperties: false
    ComparisonEntry:
      type: object
      properties:
        runId: {$ref: '#/components/schemas/Uuid'}
        method: {type: string, minLength: 1}
        metrics: {$ref: '#/components/schemas/RunMetrics'}
      required: [runId, method, metrics]
      additionalProperties: false
    Comparison:
      type: object
      properties:
        comparisonKey: {$ref: '#/components/schemas/Hash'}
        datasetVersion: {$ref: '#/components/schemas/Uuid'}
        featureSchemaVersion: {type: string, minLength: 1}
        protocolVersion: {type: string, minLength: 1}
        runs:
          type: array
          items: {$ref: '#/components/schemas/ComparisonEntry'}
          minItems: 2
        limitations:
          type: array
          items: {type: string, minLength: 1}
          minItems: 0
      required: [comparisonKey, datasetVersion, featureSchemaVersion, protocolVersion, runs, limitations]
      additionalProperties: false
    TrendPoint:
      type: object
      properties:
        periodStart: {type: string, format: date}
        records: {type: integer, minimum: 0}
        observedLabels: {type: integer, minimum: 0}
        positiveLabels: {type: integer, minimum: 0}
        unknownLabels: {type: integer, minimum: 0}
        observedPositiveRate: {$ref: '#/components/schemas/MetricScore'}
        meanRisk: {$ref: '#/components/schemas/MetricScore'}
      required: [periodStart, records, observedLabels, positiveLabels, unknownLabels, observedPositiveRate, meanRisk]
      additionalProperties: false
    Trend:
      type: object
      properties:
        runId: {$ref: '#/components/schemas/Uuid'}
        datasetVersion: {$ref: '#/components/schemas/Uuid'}
        bucket:
          type: string
          enum: [day, week, month]
        timezone: {const: Asia/Shanghai}
        points:
          type: array
          items: {$ref: '#/components/schemas/TrendPoint'}
          minItems: 0
        limitations:
          type: array
          items: {type: string, minLength: 1}
          minItems: 1
      required: [runId, datasetVersion, bucket, timezone, points, limitations]
      additionalProperties: false
    ExperimentReport:
      type: object
      properties:
        run: {$ref: '#/components/schemas/ExperimentRun'}
        source: {type: object}
        manifestSha256: {$ref: '#/components/schemas/Hash'}
        generatedAt: {type: string, format: date-time}
        attempts:
          type: array
          items:
            type: object
            properties:
              attemptId: {$ref: '#/components/schemas/Uuid'}
              state:
                type: string
                enum: [queued, running, succeeded, failed]
              error:
                oneOf:
                - type: object
                  properties:
                    code: {$ref: '#/components/schemas/GlobalErrorCode'}
                    message: {type: string, minLength: 1}
                  required: [code, message]
                  additionalProperties: false
                - {type: 'null'}
            required: [attemptId, state, error]
            additionalProperties: false
          minItems: 0
        limitations:
          type: array
          items: {type: string, minLength: 1}
          minItems: 0
      required: [run, source, manifestSha256, generatedAt, attempts, limitations]
      additionalProperties: false
    DatasetImportForm:
      type: object
      properties:
        descriptor: {$ref: '#/components/schemas/DatasetDescriptor'}
        file: {type: string, format: binary}
      required: [descriptor, file]
      additionalProperties: false
    PredictionCsvForm:
      type: object
      properties:
        modelId: {$ref: '#/components/schemas/Uuid'}
        featureSchemaVersion:
