          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '409':
          description: 当前响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '413':
          description: 当前响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
        '422':
          description: 当前响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRegistrationCreate'
      description: 201 新模型，200 复用原 runId；仅选择候选，不接受路径／URL／上传。
components:
  schemas:
    ModelRegistration:
      type: object
      properties:
        created:
          type: boolean
        model:
          $ref: '#/components/schemas/ModelInfo'
      required:
      - created
      - model
      additionalProperties: false
    ModelRegistrationCreate:
      type: object
      properties:
        candidateId:
          $ref: '#/components/schemas/Hash'
        expectedManifestSha256:
          $ref: '#/components/schemas/Hash'
      required:
      - candidateId
      - expectedManifestSha256
      additionalProperties: false
    ModelCandidateList:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ModelCandidate'
      required:
      - candidates
      additionalProperties: false
    ModelCandidate:
      type: object
      properties:
        candidateId:
          $ref: '#/components/schemas/Hash'
        displayName:
          type: string
          minLength: 1
        state:
          enum:
          - candidate
          - invalid
        manifestSha256:
          oneOf:
          - $ref: '#/components/schemas/Hash'
          - type: 'null'
        artifactRunId:
          $ref: '#/components/schemas/Hash'
        method:
          type:
          - string
          - 'null'
        featureSchemaVersion:
          type:
          - string
          - 'null'
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/GlobalErrorCode'
            message:
              type: string
              minLength: 1
          required:
          - code
          - message
          additionalProperties: false
      required:
      - candidateId
      - displayName
      - state
      - manifestSha256
      additionalProperties: false
    Hash: {type: string, pattern: '^[a-f0-9]{64}$'}
    Uuid: {type: string, format: uuid}
    MetricScore:
      oneOf:
      - type: object
        properties:
          value: {type: number, minimum: 0, maximum: 1}
          reason: {type: 'null'}
        required: [value, reason]
        additionalProperties: false
      - type: object
        properties:
          value: {type: 'null'}
          reason: {type: string, minLength: 1}
        required: [value, reason]
        additionalProperties: false
    SixFeatures:
      type: object
      properties:
        ns: {type: integer, minimum: 0}
        nd: {type: integer, minimum: 0}
        nf: {type: integer, minimum: 0}
        ent: {type: number, minimum: 0}
        la: {type: integer, minimum: 0}
        ld: {type: integer, minimum: 0}
      required: [ns, nd, nf, ent, la, ld]
      additionalProperties: false
    Kamei14Features:
      type: object
      properties:
        ns: {type: integer, minimum: 0}
        nd: {type: integer, minimum: 0}
        nf: {type: integer, minimum: 0}
        entropy: {type: number, minimum: 0}
        la: {type: integer, minimum: 0}
        ld: {type: integer, minimum: 0}
        lt: {type: integer, minimum: 0}
        fix: {type: boolean}
        ndev: {type: integer, minimum: 0}
        age: {type: number, minimum: 0}
        nuc: {type: integer, minimum: 0}
        exp: {type: integer, minimum: 0}
        rexp: {type: number, minimum: 0}
        sexp: {type: integer, minimum: 0}
      required: [ns, nd, nf, entropy, la, ld, lt, fix, ndev, age, nuc, exp, rexp, sexp]
      additionalProperties: false
      description: 候选完整14维结构，来源和语义尚待核验；不是现有快照已支持。
    ModelProvenance:
      type: object
      properties:
        id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        sha256: {$ref: '#/components/schemas/Hash'}
      required: [id, name, sha256]
      additionalProperties: false
    CurrentRecord:
      type: object
      properties:
        id: {type: string, pattern: '^[a-f0-9]{40}$'}
        time: {type: string, format: date-time}
        risk: {type: number, minimum: 0, maximum: 1}
        lines: {type: integer, minimum: 0}
        files: {type: integer, minimum: 0}
        metrics: {$ref: '#/components/schemas/SixFeatures'}
      required: [id, time, risk, lines, files, metrics]
      additionalProperties: false
    Confusion:
      type: object
      properties:
        tp: {type: integer, minimum: 0}
        fp: {type: integer, minimum: 0}
        tn: {type: integer, minimum: 0}
        fn: {type: integer, minimum: 0}
      required: [tp, fp, tn, fn]
      additionalProperties: false
    Classification:
      type: object
      properties:
        precision: {$ref: '#/components/schemas/MetricScore'}
        recall: {$ref: '#/components/schemas/MetricScore'}
        f1: {$ref: '#/components/schemas/MetricScore'}
        confusion: {$ref: '#/components/schemas/Confusion'}
      required: [precision, recall, f1, confusion]
      additionalProperties: false
    BaselineMetrics:
      type: object
      properties:
        precision: {$ref: '#/components/schemas/MetricScore'}
        recall: {$ref: '#/components/schemas/MetricScore'}
        f1: {$ref: '#/components/schemas/MetricScore'}
        confusion: {$ref: '#/components/schemas/Confusion'}
        rocAuc: {$ref: '#/components/schemas/MetricScore'}
        averagePrecision: {$ref: '#/components/schemas/MetricScore'}
        recall20Loc: {$ref: '#/components/schemas/MetricScore'}
        threshold: {const: 0.5}
        counts:
          type: object
          properties:
            records: {type: integer, minimum: 0}
            positive: {type: integer, minimum: 0}
            negative: {type: integer, minimum: 0}
          required: [records, positive, negative]
          additionalProperties: false
        effort:
          type: object
          properties:
            name: {const: Recall@20%LOC (risk-ranked)}
            totalLoc: {type: number, minimum: 0}
            budgetLoc: {type: number, minimum: 0}
            usedLoc: {type: number, minimum: 0}
            selectedCount: {type: integer, minimum: 0}
            ordering: {const: 'risk-desc,time-desc,id-asc'}
            policy: {const: whole-commit-prefix-stop}
          required: [name, totalLoc, budgetLoc, usedLoc, selectedCount, ordering, policy]
          additionalProperties: false
        reference:
          type: object
          properties:
            apNoInformation: {type: number, minimum: 0, maximum: 1}
            allNegative: {$ref: '#/components/schemas/Classification'}
          required: [apNoInformation, allNegative]
          additionalProperties: false
      required: [precision, recall, f1, confusion, rocAuc, averagePrecision, recall20Loc, threshold, counts, effort,
        reference]
      additionalProperties: false
    SourceFile:
      type: object
      properties:
        url: {type: string, format: uri, pattern: '^https://'}
        sha256: {$ref: '#/components/schemas/Hash'}
        bytes: {type: integer, minimum: 0}
      required: [url, sha256, bytes]
      additionalProperties: false
    CurrentQuality:
      type: object
      properties:
        rawRows: {type: integer, minimum: 0}
        includedRows: {type: integer, minimum: 0}
        positiveLabels: {type: integer, minimum: 0}
        blankLabels: {type: integer, minimum: 0}
        excluded:
          type: object
          properties:
            outsideWindow: {type: integer, minimum: 0}
            noAddedLines: {type: integer, minimum: 0}
            tooMuchChurn: {type: integer, minimum: 0}
            tooManyFiles: {type: integer, minimum: 0}
          required: [outsideWindow, noAddedLines, tooMuchChurn, tooManyFiles]
          additionalProperties: false
        featureMissing:
          type: object
          properties:
            ns: {type: integer, minimum: 0}
            nd: {type: integer, minimum: 0}
            nf: {type: integer, minimum: 0}
            ent: {type: integer, minimum: 0}
            la: {type: integer, minimum: 0}
            ld: {type: integer, minimum: 0}
          required: [ns, nd, nf, ent, la, ld]
          additionalProperties: false
      required: [rawRows, includedRows, positiveLabels, blankLabels, excluded, featureMissing]
      additionalProperties: false
    CurrentSource:
      type: object
      properties:
        publisher: {type: string, minLength: 1}
        revision: {type: string, minLength: 1}
        url: {type: string, format: uri, pattern: '^https://'}
        sha256: {$ref: '#/components/schemas/Hash'}
        citation: {type: string, minLength: 1}
        labelRule: {type: string, minLength: 1}
        files:
          type: object
          properties:
            openstack.csv: {$ref: '#/components/schemas/SourceFile'}
            load_data.r: {$ref: '#/components/schemas/SourceFile'}
            experimental_settings.r: {$ref: '#/components/schemas/SourceFile'}
          required: [openstack.csv, load_data.r, experimental_settings.r]
          additionalProperties: false
        quality: {$ref: '#/components/schemas/CurrentQuality'}
      required: [publisher, revision, url, sha256, citation, labelRule, files, quality]
      additionalProperties: false
    Cohort:
      type: object
      properties:
        startEpochInclusive: {type: integer, minimum: 0}
        endEpochExclusive: {type: integer, minimum: 0}
        addedLinesGreaterThan: {type: integer, minimum: 0}
        maxChurnInclusive: {type: integer, minimum: 0}
        maxFilesInclusive: {type: integer, minimum: 0}
      required: [startEpochInclusive, endEpochExclusive, addedLinesGreaterThan, maxChurnInclusive, maxFilesInclusive]
      additionalProperties: false
    SplitPart:
      type: object
      properties:
        count: {type: integer, minimum: 0}
        positiveCount: {type: integer, minimum: 0}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
      required: [count, positiveCount, start, end]
      additionalProperties: false
    BaselineSummary:
      type: object
      properties:
        runId: {$ref: '#/components/schemas/Hash'}
        datasetVersion: {type: string, minLength: 1}
        modelSha256: {$ref: '#/components/schemas/Hash'}
        features:
          const: [ns, nd, nf, ent, la, ld]
        threshold: {const: 0.5}
        protocolVersion: {type: string, minLength: 1}
        limitations:
          type: array
          items: {type: string, minLength: 1}
          minItems: 1
        source: {$ref: '#/components/schemas/CurrentSource'}
        cohort: {$ref: '#/components/schemas/Cohort'}
        split:
          type: object
          properties:
            train: {$ref: '#/components/schemas/SplitPart'}
            validation: {$ref: '#/components/schemas/SplitPart'}
            test: {$ref: '#/components/schemas/SplitPart'}
          required: [train, validation, test]
          additionalProperties: false
        metrics: {$ref: '#/components/schemas/BaselineMetrics'}
      required: [runId, datasetVersion, modelSha256, features, threshold, protocolVersion, limitations, source,
        cohort, split, metrics]
      additionalProperties: false
    HistoricalBatch:
      type: object
      properties:
        contractVersion: {const: 1}
        mode: {const: historical}
        project: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
        datasetVersion: {type: string, minLength: 1}
        runId: {$ref: '#/components/schemas/Hash'}
        model: {$ref: '#/components/schemas/ModelProvenance'}
        summary: {$ref: '#/components/schemas/BaselineSummary'}
        records:
          type: array
          items: {$ref: '#/components/schemas/CurrentRecord'}
          minItems: 1
      required: [contractVersion, mode, project, version, datasetVersion, runId, model, summary, records]
      additionalProperties: false
      description: 当前实现结构。运行／模型／数据身份、分区、记录数量须跨字段一致，由当前服务和客户端校验；来源只是回顾性历史数据。
    GlobalErrorCode:
      type: string
      enum: [ARTIFACT_UNAVAILABLE, INTEGRITY_ERROR, ARTIFACT_INVALID, MODEL_INVALID, INFERENCE_ERROR, SOURCE_UNAVAILABLE,
        DATA_INVALID, OUTPUT_EXISTS, SPLIT_INVALID, FEATURES_INVALID, MODEL_NOT_CONVERGED, EVALUATION_INVALID, REPRODUCTION_FAILED,
        SCHEMA_UNKNOWN, SCHEMA_FIELD_UNAVAILABLE, ALGORITHM_UNKNOWN,
        AUTH_REQUIRED, ACCESS_DENIED, NOT_FOUND, SOURCE_HASH_MISMATCH, INPUT_SCHEMA_MISMATCH, INPUT_INVALID, INPUT_LIMIT_EXCEEDED,
        CONTEXT_MISMATCH, MODEL_NOT_READY, RUN_NOT_READY, EXPLANATION_FAILED, ACCESS_CONFIG_INVALID, STORAGE_UNAVAILABLE]
      description: 码名与HTTP／任务语义的唯一文字定义见../全局错误码表.md；枚举含当前HTTP、相关CLI及候选新接口。
    CurrentError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              allOf:
              - {$ref: '#/components/schemas/GlobalErrorCode'}
              - enum: [ARTIFACT_UNAVAILABLE, INTEGRITY_ERROR, ARTIFACT_INVALID, MODEL_INVALID, INFERENCE_ERROR]
            message: {type: string, minLength: 1}
          required: [code, message]
          additionalProperties: false
      required: [error]
      additionalProperties: false
    ErrorDetail:
      type: object
      properties:
        recordId:
          type: [string, 'null']
        row:
          type: [integer, 'null']
          minimum: 1
        field:
          type: [string, 'null']
        reason: {type: string, minLength: 1}
      required: [reason]
      additionalProperties: false
    SharedError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {$ref: '#/components/schemas/GlobalErrorCode'}
            message: {type: string, minLength: 1}
            details:
              type: array
              items: {$ref: '#/components/schemas/ErrorDetail'}
              minItems: 0
            requestId: {type: string, minLength: 1}
          required: [code, message]
          additionalProperties: false
      required: [error]
      additionalProperties: false
    FeatureField:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - integer
          - number
          - boolean
        unit:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        sourceStatus:
          type: string
          enum:
          - verified
          - pending
          - missing
        inModel:
          type: boolean
        sourceColumn:
          type:
          - string
          - 'null'
        transform:
          enum:
          - log1p
          - raw
        reason:
          type:
          - string
          - 'null'
      required:
      - name
      - type
      - unit
      - description
      - sourceStatus
      - inModel
      - sourceColumn
      - transform
      - reason
      additionalProperties: false
    FeatureSchema:
      type: object
      properties:
        featureSchemaVersion:
          type: string
          minLength: 1
        state:
          type: string
          enum:
          - draft
          - ready
          - invalid
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FeatureField'
          minItems: 1
        schemaSha256:
          oneOf:
          - $ref: '#/components/schemas/Hash'
          - type: 'null'
        transforms:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
        limitations:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
        inModel:
          type: array
          items:
            type: string
            minLength: 1
        jsonPredictionSupported:
          type: boolean
      required:
      - featureSchemaVersion
      - state
      - fields
      - schemaSha256
      - transforms
      - limitations
      - inModel
      - jsonPredictionSupported
      additionalProperties: false
    LabelRule:
      type: object
      properties:
        field: {type: string, minLength: 1}
        positiveRule:
          type: string
          enum: [count-gt-zero, binary-one]
        blankPolicy:
          type: string
          enum: [unobserved-zero, unknown, reject]
        negativeMeaning: {const: not-observed}
      required: [field, positiveRule, blankPolicy, negativeMeaning]
      additionalProperties: false
    DatasetDescriptor:
      type: object
      properties:
        name: {type: string, minLength: 1}
        sourceKey: {type: string, minLength: 1}
        sourceUrl: {type: string, format: uri, pattern: '^https://'}
        revision: {type: string, minLength: 1}
        sourceSha256: {$ref: '#/components/schemas/Hash'}
        citation: {type: string, minLength: 1}
        featureSchemaVersion: {type: string, minLength: 1}
        idField: {type: string, minLength: 1}
        timeField: {type: string, minLength: 1}
        timeFormat:
          type: string
          enum: [unix-seconds-utc, iso8601]
        labelRule: {$ref: '#/components/schemas/LabelRule'}
      required: [name, sourceKey, sourceUrl, revision, sourceSha256, citation, featureSchemaVersion, idField, timeField,
        timeFormat, labelRule]
      additionalProperties: false
    QualityReport:
      type: object
      properties:
        datasetVersion: {$ref: '#/components/schemas/Uuid'}
        sourceSha256: {$ref: '#/components/schemas/Hash'}
        featureSchemaVersion: {type: string, minLength: 1}
        rawRows: {type: integer, minimum: 0}
        includedRows: {type: integer, minimum: 0}
        excluded:
          type: object
          additionalProperties: {type: integer, minimum: 0}
        duplicateIds: {type: integer, minimum: 0}
        featureMissing:
          type: object
          additionalProperties: {type: integer, minimum: 0}
        labels:
          type: object
          properties:
            positive: {type: integer, minimum: 0}
            notObserved: {type: integer, minimum: 0}
            unknown: {type: integer, minimum: 0}
          required: [positive, notObserved, unknown]
          additionalProperties: false
        limitations:
          type: array
          items: {type: string, minLength: 1}
          minItems: 0
      required: [datasetVersion, sourceSha256, featureSchemaVersion, rawRows, includedRows, excluded, duplicateIds,
        featureMissing, labels, limitations]
      additionalProperties: false
    DatasetVersionInfo:
      type: object
      properties:
        datasetVersion: {$ref: '#/components/schemas/Uuid'}
        versionKey: {type: string, minLength: 1}
        featureSchemaVersion: {type: string, minLength: 1}
        sourceSha256: {$ref: '#/components/schemas/Hash'}
        state:
          type: string
          enum: [registered, validating, ready, invalid]
      required: [datasetVersion, versionKey, featureSchemaVersion, sourceSha256, state]
      additionalProperties: false
    DatasetInfo:
      type: object
      properties:
        datasetId: {$ref: '#/components/schemas/Uuid'}
        name: {type: string, minLength: 1}
        sourceKey: {type: string, minLength: 1}
        sourceUrl: {type: string, format: uri}
        versions:
          type: array
          items: {$ref: '#/components/schemas/DatasetVersionInfo'}
          minItems: 0
      required: [datasetId, name, sourceKey, sourceUrl, versions]
      additionalProperties: false
    CommitSummary:
      type: object
      properties:
        commitId: {type: string, minLength: 1}
        authorTime: {type: string, format: date-time}
        label: {type: integer, enum: [0, 1]}
        module: {type: [string, 'null']}
      required: [commitId, authorTime, label, module]
      additionalProperties: false
    CommitPage:
      type: object
      properties:
        datasetVersion: {type: string, minLength: 1}
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 500}
        offset: {type: integer, minimum: 0}
        commits:
          type: array
          items: {$ref: '#/components/schemas/CommitSummary'}
          minItems: 0
      required: [datasetVersion, total, limit, offset, commits]
      additionalProperties: false
    CommitDetail:
      type: object
      properties:
        commitId: {type: string, minLength: 1}
        datasetVersion: {type: string, minLength: 1}
        authorTime: {type: string, format: date-time}
        label: {type: integer, enum: [0, 1]}
        labelRule: {type: string, minLength: 1}
        features:
          type: object
          additionalProperties: {type: number}
      required: [commitId, datasetVersion, authorTime, label, labelRule, features]
      additionalProperties: false
    DatasetList:
      type: object
      properties:
        datasets:
          type: array
          items: {$ref: '#/components/schemas/DatasetInfo'}
          minItems: 0
      required: [datasets]
      additionalProperties: false
    DatasetImportResult:
      type: object
      properties:
        dataset: {$ref: '#/components/schemas/DatasetInfo'}
        version:
          allOf:
          - {$ref: '#/components/schemas/DatasetVersionInfo'}
          - properties:
              state: {const: ready}
        quality: {$ref: '#/components/schemas/QualityReport'}
      required: [dataset, version, quality]
      additionalProperties: false
    ExperimentCreate:
      type: object
      properties:
        datasetVersion: {$ref: '#/components/schemas/Uuid'}
        featureSchemaVersion: {type: string, minLength: 1}
        method:
          type: string
          enum: [logistic-regression, gaussian-naive-bayes, decision-tree, random-forest, gradient-boosting, mlp,
            tabular-resnet, ft-transformer]
        protocolVersion: {type: string, minLength: 1}
        parameters:
          type: object
          additionalProperties:
            type: [number, string, boolean, 'null']
        seed: {type: integer}
      required: [datasetVersion, featureSchemaVersion, method, protocolVersion]
      additionalProperties: false
      description: 候选方法列表不代表已实现。parameters须由方法白名单校验，protocolVersion指向测试前已冻结协议；不允许任意代码／路径或按最终测试效果改成员。
    RunAccepted:
      type: object
      properties:
        runId: {$ref: '#/components/schemas/Uuid'}
        state: {const: queued}
        attemptId: {$ref: '#/components/schemas/Uuid'}
      required: [runId, state, attemptId]
      additionalProperties: false
    RunMetrics:
      type: object
      properties:
        rocAuc: {$ref: '#/components/schemas/MetricScore'}
        averagePrecision: {$ref: '#/components/schemas/MetricScore'}
        precision: {$ref: '#/components/schemas/MetricScore'}
        recall: {$ref: '#/components/schemas/MetricScore'}
        f1: {$ref: '#/components/schemas/MetricScore'}
        recall20Loc: {$ref: '#/components/schemas/MetricScore'}
        popt: {$ref: '#/components/schemas/MetricScore'}
        threshold: {type: number, minimum: 0, maximum: 1}
        confusion: {$ref: '#/components/schemas/Confusion'}
        testCount: {type: integer, minimum: 0}
        positiveCount: {type: integer, minimum: 0}
        costPolicy: {type: string, minLength: 1}
        ordering: {type: string, minLength: 1}
      required: [rocAuc, averagePrecision, precision, recall, f1, recall20Loc, popt, threshold, confusion, testCount,
        positiveCount, costPolicy, ordering]
      additionalProperties: false
    ArtifactReference:
      type: object
      properties:
        key: {type: string, minLength: 1}
        sha256: {$ref: '#/components/schemas/Hash'}
        bytes: {type: integer, minimum: 0}
        purpose: {type: string, minLength: 1}
      required: [key, sha256, bytes, purpose]
      additionalProperties: false
    ExperimentRun:
      type: object
      properties:
        runId: {$ref: '#/components/schemas/Uuid'}
        datasetVersion: {$ref: '#/components/schemas/Uuid'}
        featureSchemaVersion: {type: string, minLength: 1}
        method: {type: string, minLength: 1}
        protocolVersion: {type: string, minLength: 1}
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        comparisonKey: {$ref: '#/components/schemas/Hash'}
        config: {type: object}
        split: {type: object}
        metrics:
          oneOf:
          - {$ref: '#/components/schemas/RunMetrics'}
          - {type: 'null'}
        error:
          oneOf:
          - type: object
            properties:
              code: {$ref: '#/components/schemas/GlobalErrorCode'}
              message: {type: string, minLength: 1}
            required: [code, message]
            additionalProperties: false
          - {type: 'null'}
        artifacts:
          type: array
          items: {$ref: '#/components/schemas/ArtifactReference'}
          minItems: 0
        limitations:
          type: array
          items: {type: string, minLength: 1}
          minItems: 0
      required: [runId, datasetVersion, featureSchemaVersion, method, protocolVersion, state, comparisonKey, config,
        split, metrics, error, artifacts, limitations]
      additionalProperties: false
    ModelInfo:
      type: object
      properties:
        modelId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
        runId:
          $ref: '#/components/schemas/Uuid'
        datasetVersion:
          $ref: '#/components/schemas/Uuid'
        featureSchemaVersion:
          type: string
          minLength: 1
        sha256:
          $ref: '#/components/schemas/Hash'
