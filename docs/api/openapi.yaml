      x-user-stories: [US-10, US-11, US-12, US-13, US-14, US-15, US-17, US-18, US-19]
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: 当前成功响应
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoricalBatch'}
          headers:
            Cache-Control:
              description: 当前服务成功响应不缓存
              schema: {const: no-store}
        '503': {$ref: '#/components/responses/CurrentUnavailable'}
        '500': {$ref: '#/components/responses/CurrentInferenceFailure'}
      description: 仅本机、无鉴权、实际调用已加载模型，不读取逐条评价标签。当前服务关闭Swagger／OpenAPI地址，此文档不改变运行行为。
  /api/v1/commits:
    get:
      operationId: listCommits
      summary: 提交级数据分页列表
      tags: [目标共享产品]
      x-api-id: API-18
      x-user-stories: [US-01, US-23]
      x-implementation-status: implemented
      security:
      - TeamToken: []
      x-auth-status: implemented
      x-access-policy: read
      parameters:
      - name: version
        in: query
        required: true
        schema: {type: string, minLength: 1}
      - name: module
        in: query
        required: false
        schema: {type: string, minLength: 1}
      - name: limit
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      - name: offset
        in: query
        required: false
        schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: 当前响应，列表项只含摘要
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommitPage'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InputInvalid'}
      description: 列表项为 commitId／authorTime／label／module，不返回特征。limit 越界（0、501、负数、非整数）返回 422 INPUT_INVALID，不静默截断；未知 version 返回 404。
