        featureSchemaVersion:
          type: string
          minLength: 1
        datasetVersion:
          type: string
          minLength: 1
        inputSha256:
          $ref: '#/components/schemas/Hash'
        sourceKind:
          type: string
          enum:
          - client-features
          - persisted-commit
        records:
          type: array
          items:
            $ref: '#/components/schemas/PredictionRecord'
          minItems: 1
          maxItems: 1
        limitations:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        createdAt:
          type: string
          format: date-time
      required:
      - mode
      - batchId
      - project
      - runId
      - model
      - featureSchemaVersion
      - inputSha256
      - sourceKind
      - records
      - limitations
      - createdAt
      additionalProperties: false
    Contribution:
      type: object
      properties:
        feature:
          type: string
          minLength: 1
        rawValue:
          type:
          - number
          - boolean
        contribution:
          type: number
        direction:
          type: string
          enum:
          - increase
          - decrease
          - neutral
      required:
      - feature
      - rawValue
      - contribution
      - direction
      additionalProperties: false
    Explanation:
      type: object
      properties:
        predictionId:
          $ref: '#/components/schemas/Uuid'
        modelId:
          $ref: '#/components/schemas/Uuid'
        runId:
          $ref: '#/components/schemas/Uuid'
        featureSchemaVersion:
          type: string
          minLength: 1
        state:
          type: string
          enum:
          - pending
          - ready
          - failed
        method:
          type:
          - string
          - 'null'
        backgroundHash:
          oneOf:
          - $ref: '#/components/schemas/Hash'
          - type: 'null'
        baseValue:
          type:
          - number
          - 'null'
        unit:
          type:
          - string
          - 'null'
        contributions:
          type: array
          items:
            $ref: '#/components/schemas/Contribution'
          minItems: 0
        error:
          oneOf:
          - type: object
            properties:
              code:
                $ref: '#/components/schemas/GlobalErrorCode'
              message:
                type: string
                minLength: 1
            required:
            - code
            - message
            additionalProperties: false
          - type: 'null'
      required:
      - predictionId
      - modelId
      - runId
      - featureSchemaVersion
      - state
      - method
      - backgroundHash
      - baseValue
      - unit
      - contributions
      - error
      additionalProperties: false
      allOf:
      - if:
          properties:
            state:
              const: ready
        then:
          properties:
            method:
              type: string
              minLength: 1
            backgroundHash:
              $ref: '#/components/schemas/Hash'
            baseValue:
              type: number
            unit:
              type: string
              minLength: 1
            contributions:
              type: array
              items:
                $ref: '#/components/schemas/Contribution'
              minItems: 1
            error:
              type: 'null'
      - if:
          properties:
            state:
              const: failed
        then:
          properties:
            error:
              type: object
              properties:
                code:
                  $ref: '#/components/schemas/GlobalErrorCode'
                message:
                  type: string
                  minLength: 1
              required:
              - code
              - message
              additionalProperties: false
    ComparisonEntry:
      type: object
      properties:
        runId:
          $ref: '#/components/schemas/Uuid'
        method:
          type: string
          minLength: 1
        metrics:
          $ref: '#/components/schemas/RunMetrics'
      required:
      - runId
      - method
      - metrics
      additionalProperties: false
    Comparison:
      type: object
      properties:
        comparisonKey:
          $ref: '#/components/schemas/Hash'
        datasetVersion:
          $ref: '#/components/schemas/Uuid'
        featureSchemaVersion:
          type: string
          minLength: 1
        protocolVersion:
          type: string
          minLength: 1
        runs:
          type: array
          items:
            $ref: '#/components/schemas/ComparisonEntry'
          minItems: 2
        limitations:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
      required:
      - comparisonKey
      - datasetVersion
      - featureSchemaVersion
      - protocolVersion
      - runs
      - limitations
      additionalProperties: false
    TrendPoint:
      type: object
      properties:
        periodStart:
          type: string
          format: date
        records:
          type: integer
          minimum: 0
        observedLabels:
          type: integer
          minimum: 0
        positiveLabels:
          type: integer
          minimum: 0
        unknownLabels:
          type: integer
          minimum: 0
        observedPositiveRate:
          $ref: '#/components/schemas/MetricScore'
        meanRisk:
          $ref: '#/components/schemas/MetricScore'
      required:
      - periodStart
      - records
      - observedLabels
      - positiveLabels
      - unknownLabels
      - observedPositiveRate
      - meanRisk
      additionalProperties: false
    Trend:
      type: object
      properties:
        runId:
          $ref: '#/components/schemas/Uuid'
        datasetVersion:
          $ref: '#/components/schemas/Uuid'
        bucket:
          type: string
          enum:
          - day
          - week
          - month
        timezone:
          const: Asia/Shanghai
        points:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
          minItems: 0
        limitations:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
      required:
      - runId
      - datasetVersion
      - bucket
      - timezone
      - points
      - limitations
      additionalProperties: false
    ExperimentReport:
      type: object
      properties:
        run:
          $ref: '#/components/schemas/ExperimentRun'
        source:
          type: object
        manifestSha256:
          $ref: '#/components/schemas/Hash'
        generatedAt:
          type: string
          format: date-time
        attempts:
          type: array
          items:
            type: object
            properties:
              attemptId:
                $ref: '#/components/schemas/Uuid'
              state:
                type: string
                enum:
                - queued
                - running
                - succeeded
                - failed
              error:
                oneOf:
                - type: object
                  properties:
                    code:
                      $ref: '#/components/schemas/GlobalErrorCode'
                    message:
                      type: string
                      minLength: 1
                  required:
                  - code
                  - message
                  additionalProperties: false
                - type: 'null'
            required:
            - attemptId
            - state
            - error
            additionalProperties: false
          minItems: 0
        limitations:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
      required:
      - run
      - source
      - manifestSha256
      - generatedAt
      - attempts
      - limitations
      additionalProperties: false
    DatasetImportForm:
      type: object
      properties:
        descriptor:
          $ref: '#/components/schemas/DatasetDescriptor'
        file:
          type: string
          format: binary
      required:
      - descriptor
      - file
      additionalProperties: false
    PredictionCsvForm:
      type: object
      properties:
        modelId:
          $ref: '#/components/schemas/Uuid'
        featureSchemaVersion:
          type: string
          enum:
          - openstack-six-v1
          - kamei14-v1
        project:
          type: string
          minLength: 1
        file:
          type: string
          format: binary
      required:
      - modelId
      - featureSchemaVersion
      - project
      - file
      additionalProperties: false
  responses:
    CurrentUnavailable:
      description: 当前Snapshot加载失败，无旧或部分批次。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentError'
    CurrentInferenceFailure:
      description: 当前实际模型推理失败，无批次。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentError'
    NotFound:
      description: 资源标识不存在；planned契约。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    RepositoryUnknown:
      description: 仓库标识不存在（`REPOSITORY_UNKNOWN`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    InputInvalid:
      description: 输入、hash、schema或数值不合法；planned契约。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    InputLimitExceeded:
      description: 超过候选大小／行数上限；planned契约。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    ContextMismatch:
      description: 运行比较／版本上下文不一致；planned契约。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    ModelUnavailable:
      description: 模型不ready或产物不可用；planned契约。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    RunNotReady:
      description: 完整成功运行不可用；planned契约。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    InferenceFailure:
      description: 实际推理异常或输出非法；planned契约。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    StorageUnavailable:
      description: 数据目录未初始化或数据库不可用；当前实现返回 503 STORAGE_UNAVAILABLE。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
    RepositoryUnavailable:
      description: 仓库不可达、分支不存在或克隆失败；当前实现返回 502 REPOSITORY_UNAVAILABLE。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedError'
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: jit_admin_session
