      - mode
      - batchId
      - project
      - runId
      - model
      - featureSchemaVersion
      - inputSha256
      - sourceKind
      - records
      - limitations
      - createdAt
      additionalProperties: false
    Contribution:
      type: object
      properties:
        feature: {type: string, minLength: 1}
        rawValue:
          type: [number, boolean]
        contribution: {type: number}
        direction:
          type: string
          enum: [increase, decrease, neutral]
      required: [feature, rawValue, contribution, direction]
      additionalProperties: false
    Explanation:
      type: object
      properties:
        predictionId: {$ref: '#/components/schemas/Uuid'}
        modelId: {$ref: '#/components/schemas/Uuid'}
        runId: {$ref: '#/components/schemas/Uuid'}
        featureSchemaVersion: {type: string, minLength: 1}
        state:
          type: string
          enum: [pending, ready, failed]
        method:
          type: [string, 'null']
        backgroundHash:
          oneOf:
          - {$ref: '#/components/schemas/Hash'}
          - {type: 'null'}
        baseValue:
          type: [number, 'null']
        unit:
          type: [string, 'null']
        contributions:
          type: array
          items: {$ref: '#/components/schemas/Contribution'}
          minItems: 0
        error:
          oneOf:
          - type: object
            properties:
              code: {$ref: '#/components/schemas/GlobalErrorCode'}
              message: {type: string, minLength: 1}
            required: [code, message]
            additionalProperties: false
          - {type: 'null'}
      required: [predictionId, modelId, runId, featureSchemaVersion, state, method, backgroundHash, baseValue, unit,
