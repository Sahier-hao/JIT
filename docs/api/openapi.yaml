openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info: {title: JIT Review 产品接口文档, version: 1.0.0-draft, description: 文档基线评审稿。仅API-01当前已实现，其余14操作为局域网共享目标的候选契约。字段例子为人工格式示例。当前API-01保持本机与既有响应；本文件不部署接口。全局错误码见../全局错误码表.md。}
tags:
- {name: 现有历史回放}
- {name: 目标共享产品}
paths:
  /api/review-batch:
    get:
      operationId: getHistoricalReviewBatch
      summary: 当前固定六字段真实历史批次
      tags: [现有历史回放]
      x-api-id: API-01
      x-user-stories: [US-10, US-11, US-12, US-13, US-14, US-15, US-17, US-18, US-19]
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: 当前成功响应
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoricalBatch'}
          headers:
            Cache-Control:
              description: 当前服务成功响应不缓存
              schema: {const: no-store}
        '503': {$ref: '#/components/responses/CurrentUnavailable'}
        '500': {$ref: '#/components/responses/CurrentInferenceFailure'}
      description: 仅本机、无鉴权、实际调用已加载模型，不读取逐条评价标签。当前服务关闭Swagger／OpenAPI地址，此文档不改变运行行为。
  /api/v1/datasets:
    get:
      operationId: listDatasets
      summary: 共享数据来源与版本列表
      tags: [目标共享产品]
      x-api-id: API-02
      x-user-stories: [US-01, US-23]
      x-implementation-status: planned
      security:
      - TeamToken: []
      responses:
        '200':
          description: 候选成功响应，尚未实现
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatasetList'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
      x-auth-status: proposed
      x-access-policy: read
  /api/v1/datasets/import:
    post:
      operationId: importDataset
      summary: 注册并校验公开CSV数据
      tags: [目标共享产品]
      x-api-id: API-03
      x-user-stories: [US-01, US-02, US-03, US-23]
      x-implementation-status: planned
      security:
      - TeamToken: []
      responses:
        '201':
          description: 候选成功响应，尚未实现
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatasetImportResult'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '422': {$ref: '#/components/responses/InputInvalid'}
        '413': {$ref: '#/components/responses/InputLimitExceeded'}
      x-auth-status: proposed
      x-access-policy: write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/DatasetImportForm'}
            encoding:
              file: {contentType: text/csv}
              descriptor: {contentType: application/json}
      x-proposed-limits: {maxBytes: 52428800, maxRows: 100000}
      description: 候选50MiB／100000条。全部原始行先校验，来源hash不匹配不能ready；相同版本复用，不任意抓取descriptor URL。
  /api/v1/datasets/versions/{datasetVersion}/quality:
    get:
      operationId: getDatasetQuality
      summary: 数据版本质量报告
      tags: [目标共享产品]
      x-api-id: API-04
      x-user-stories: [US-02, US-03]
      x-implementation-status: planned
      security:
      - TeamToken: []
      responses:
        '200':
          description: 候选成功响应，尚未实现
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QualityReport'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-auth-status: proposed
      x-access-policy: read
      parameters:
      - name: datasetVersion
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Uuid'}
  /api/v1/feature-schemas/{featureSchemaVersion}:
    get:
      operationId: getFeatureSchema
      summary: 字段定义与映射状态
      tags: [目标共享产品]
      x-api-id: API-05
      x-user-stories: [US-04, US-24]
      x-implementation-status: planned
      security:
      - TeamToken: []
      responses:
        '200':
          description: 候选成功响应，尚未实现
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeatureSchema'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-auth-status: proposed
      x-access-policy: read
      parameters:
      - name: featureSchemaVersion
        in: path
        required: true
        schema: {type: string, minLength: 1}
  /api/v1/experiments:
    post:
      operationId: createExperiment
      summary: 创建冻结协议实验
      tags: [目标共享产品]
      x-api-id: API-06
      x-user-stories: [US-05, US-06, US-07]
      x-implementation-status: planned
      security:
      - TeamToken: []
      responses:
        '202':
          description: 候选成功响应，尚未实现
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunAccepted'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '422': {$ref: '#/components/responses/InputInvalid'}
        '503': {$ref: '#/components/responses/ModelUnavailable'}
      x-auth-status: proposed
      x-access-policy: write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExperimentCreate'}
  /api/v1/experiments/{runId}:
    get:
      operationId: getExperiment
      summary: 查询实验状态与结果
      tags: [目标共享产品]
      x-api-id: API-07
      x-user-stories: [US-05, US-06, US-07, US-23]
      x-implementation-status: planned
      security:
      - TeamToken: []
      responses:
        '200':
          description: 候选成功响应，尚未实现
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExperimentRun'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-auth-status: proposed
      x-access-policy: read
      parameters:
      - name: runId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Uuid'}
  /api/v1/models:
    get:
      operationId: listModels
      summary: 可追溯模型列表
      tags: [目标共享产品]
      x-api-id: API-08
      x-user-stories: [US-08]
      x-implementation-status: planned
      security:
      - TeamToken: []
      responses:
        '200':
          description: 候选成功响应，尚未实现
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelList'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
      x-auth-status: proposed
      x-access-policy: read
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum: [ready, invalid]
          default: ready
  /api/v1/predictions:
    post:
      operationId: createPrediction
      summary: JSON单条新特征预测
      tags: [目标共享产品]
      x-api-id: API-09
      x-user-stories: [US-09, US-16, US-24]
      x-implementation-status: planned
      security:
      - TeamToken: []
      responses:
        '201':
          description: 候选成功响应，尚未实现
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictionBatch'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InputInvalid'}
        '503': {$ref: '#/components/responses/ModelUnavailable'}
        '500': {$ref: '#/components/responses/InferenceFailure'}
      x-auth-status: proposed
      x-access-policy: write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PredictionCreate'}
            example:
              modelId: 11111111-1111-4111-8111-111111111111
              featureSchemaVersion: openstack-six-v1
              project: 人工格式示例
              record:
                recordId: input-example-1
                features: {ns: 1, nd: 2, nf: 3, ent: 0.8, la: 10, ld: 2}
      description: JSON建议单条。模型／schema／环境一致，输入无标签，分数由模型生成；解释可pending或failed。成功后存储独立batch，不冒充已验证源码。
  /api/v1/predictions/{predictionId}/explanation:
    get:
      operationId: getExplanation
      summary: 查询同预测的解释状态
      tags: [目标共享产品]
      x-api-id: API-10
      x-user-stories: [US-16]
      x-implementation-status: planned
      security:
      - TeamToken: []
      responses:
        '200':
          description: 候选成功响应，尚未实现
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Explanation'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ContextMismatch'}
      x-auth-status: proposed
      x-access-policy: read
      parameters:
      - name: predictionId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Uuid'}
  /api/v1/prediction-batches/{batchId}:
    get:
      operationId: getPredictionBatch
      summary: 重开新输入预测批次
      tags: [目标共享产品]
      x-api-id: API-11
      x-user-stories: [US-09, US-11, US-15]
      x-implementation-status: planned
      security:
      - TeamToken: []
      responses:
        '200':
          description: 候选成功响应，尚未实现
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictionBatch'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-auth-status: proposed
      x-access-policy: read
      parameters:
      - name: batchId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Uuid'}
  /api/v1/prediction-batches:
    post:
      operationId: createPredictionBatch
      summary: CSV特征整批预测
      tags: [目标共享产品]
      x-api-id: API-12
      x-user-stories: [US-09, US-24]
      x-implementation-status: planned
      security:
      - TeamToken: []
      responses:
        '201':
          description: 候选成功响应，尚未实现
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictionBatch'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/InputLimitExceeded'}
        '422': {$ref: '#/components/responses/InputInvalid'}
        '503': {$ref: '#/components/responses/ModelUnavailable'}
        '500': {$ref: '#/components/responses/InferenceFailure'}
      x-auth-status: proposed
      x-access-policy: write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/PredictionCsvForm'}
            encoding:
              file: {contentType: text/csv}
      x-proposed-limits: {maxBytes: 10485760, maxRows: 1000}
      description: 候选10MiB／1000条，UTF-8，可选BOM。表头recordId＋schema字段，commitId／time可选，无label。全批校验／推理成功后才ready，不部分成功。
  /api/v1/comparisons:
    get:
      operationId: compareRuns
      summary: 同口径成功实验比较
      tags: [目标共享产品]
      x-api-id: API-13
      x-user-stories: [US-20]
      x-implementation-status: planned
      security:
      - TeamToken: []
      responses:
        '200':
          description: 候选成功响应，尚未实现
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Comparison'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ContextMismatch'}
      x-auth-status: proposed
      x-access-policy: read
      parameters:
      - name: runIds
        in: query
        required: true
        schema:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
          minItems: 2
        style: form
        explode: false
  /api/v1/trends:
    get:
      operationId: getTrend
      summary: 冻结历史观测与风险趋势
      tags: [目标共享产品]
      x-api-id: API-14
      x-user-stories: [US-21]
      x-implementation-status: planned
      security:
      - TeamToken: []
      responses:
        '200':
          description: 候选成功响应，尚未实现
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Trend'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RunNotReady'}
      x-auth-status: proposed
      x-access-policy: read
      parameters:
      - name: runId
        in: query
        required: true
        schema: {$ref: '#/components/schemas/Uuid'}
      - name: bucket
        in: query
        required: false
        schema:
          type: string
          enum: [day, week, month]
          default: week
  /api/v1/experiments/{runId}/report:
    get:
      operationId: getExperimentReport
      summary: 导出完整成功实验报告
      tags: [目标共享产品]
      x-api-id: API-15
      x-user-stories: [US-22]
      x-implementation-status: planned
      security:
      - TeamToken: []
      responses:
        '200':
          description: 候选成功响应，尚未实现
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExperimentReport'}
          headers:
            Content-Disposition:
              description: 受控报告文件名；无客户端指定路径
              schema: {type: string}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RunNotReady'}
      x-auth-status: proposed
      x-access-policy: read
      parameters:
      - name: runId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Uuid'}
components:
  schemas:
    Hash: {type: string, pattern: '^[a-f0-9]{64}$'}
    Uuid: {type: string, format: uuid}
    MetricScore:
      oneOf:
      - type: object
        properties:
          value: {type: number, minimum: 0, maximum: 1}
          reason: {type: 'null'}
        required: [value, reason]
        additionalProperties: false
      - type: object
        properties:
          value: {type: 'null'}
          reason: {type: string, minLength: 1}
        required: [value, reason]
        additionalProperties: false
    SixFeatures:
      type: object
      properties:
        ns: {type: integer, minimum: 0}
        nd: {type: integer, minimum: 0}
        nf: {type: integer, minimum: 0}
        ent: {type: number, minimum: 0}
        la: {type: integer, minimum: 0}
        ld: {type: integer, minimum: 0}
      required: [ns, nd, nf, ent, la, ld]
      additionalProperties: false
    Kamei14Features:
      type: object
      properties:
        ns: {type: integer, minimum: 0}
        nd: {type: integer, minimum: 0}
        nf: {type: integer, minimum: 0}
        entropy: {type: number, minimum: 0}
        la: {type: integer, minimum: 0}
        ld: {type: integer, minimum: 0}
        lt: {type: integer, minimum: 0}
        fix: {type: boolean}
        ndev: {type: integer, minimum: 0}
        age: {type: number, minimum: 0}
        nuc: {type: integer, minimum: 0}
        exp: {type: integer, minimum: 0}
        rexp: {type: number, minimum: 0}
        sexp: {type: integer, minimum: 0}
      required: [ns, nd, nf, entropy, la, ld, lt, fix, ndev, age, nuc, exp, rexp, sexp]
      additionalProperties: false
      description: 候选完整14维结构，来源和语义尚待核验；不是现有快照已支持。
    ModelProvenance:
      type: object
      properties:
        id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        sha256: {$ref: '#/components/schemas/Hash'}
      required: [id, name, sha256]
      additionalProperties: false
    CurrentRecord:
      type: object
      properties:
        id: {type: string, pattern: '^[a-f0-9]{40}$'}
        time: {type: string, format: date-time}
        risk: {type: number, minimum: 0, maximum: 1}
        lines: {type: integer, minimum: 0}
        files: {type: integer, minimum: 0}
        metrics: {$ref: '#/components/schemas/SixFeatures'}
      required: [id, time, risk, lines, files, metrics]
      additionalProperties: false
    Confusion:
      type: object
      properties:
        tp: {type: integer, minimum: 0}
        fp: {type: integer, minimum: 0}
        tn: {type: integer, minimum: 0}
        fn: {type: integer, minimum: 0}
      required: [tp, fp, tn, fn]
      additionalProperties: false
    Classification:
      type: object
      properties:
        precision: {$ref: '#/components/schemas/MetricScore'}
        recall: {$ref: '#/components/schemas/MetricScore'}
        f1: {$ref: '#/components/schemas/MetricScore'}
        confusion: {$ref: '#/components/schemas/Confusion'}
      required: [precision, recall, f1, confusion]
      additionalProperties: false
    BaselineMetrics:
      type: object
      properties:
        precision: {$ref: '#/components/schemas/MetricScore'}
        recall: {$ref: '#/components/schemas/MetricScore'}
        f1: {$ref: '#/components/schemas/MetricScore'}
        confusion: {$ref: '#/components/schemas/Confusion'}
        rocAuc: {$ref: '#/components/schemas/MetricScore'}
        averagePrecision: {$ref: '#/components/schemas/MetricScore'}
        recall20Loc: {$ref: '#/components/schemas/MetricScore'}
        threshold: {const: 0.5}
        counts:
          type: object
          properties:
            records: {type: integer, minimum: 0}
            positive: {type: integer, minimum: 0}
            negative: {type: integer, minimum: 0}
          required: [records, positive, negative]
          additionalProperties: false
        effort:
          type: object
          properties:
            name: {const: Recall@20%LOC (risk-ranked)}
            totalLoc: {type: number, minimum: 0}
            budgetLoc: {type: number, minimum: 0}
            usedLoc: {type: number, minimum: 0}
            selectedCount: {type: integer, minimum: 0}
            ordering: {const: 'risk-desc,time-desc,id-asc'}
            policy: {const: whole-commit-prefix-stop}
          required: [name, totalLoc, budgetLoc, usedLoc, selectedCount, ordering, policy]
          additionalProperties: false
        reference:
          type: object
          properties:
            apNoInformation: {type: number, minimum: 0, maximum: 1}
            allNegative: {$ref: '#/components/schemas/Classification'}
          required: [apNoInformation, allNegative]
          additionalProperties: false
      required: [precision, recall, f1, confusion, rocAuc, averagePrecision, recall20Loc, threshold, counts, effort,
        reference]
      additionalProperties: false
    SourceFile:
      type: object
      properties:
        url: {type: string, format: uri, pattern: '^https://'}
        sha256: {$ref: '#/components/schemas/Hash'}
        bytes: {type: integer, minimum: 0}
      required: [url, sha256, bytes]
      additionalProperties: false
    CurrentQuality:
      type: object
      properties:
        rawRows: {type: integer, minimum: 0}
        includedRows: {type: integer, minimum: 0}
        positiveLabels: {type: integer, minimum: 0}
        blankLabels: {type: integer, minimum: 0}
        excluded:
          type: object
          properties:
            outsideWindow: {type: integer, minimum: 0}
            noAddedLines: {type: integer, minimum: 0}
            tooMuchChurn: {type: integer, minimum: 0}
            tooManyFiles: {type: integer, minimum: 0}
          required: [outsideWindow, noAddedLines, tooMuchChurn, tooManyFiles]
          additionalProperties: false
        featureMissing:
          type: object
          properties:
            ns: {type: integer, minimum: 0}
            nd: {type: integer, minimum: 0}
            nf: {type: integer, minimum: 0}
            ent: {type: integer, minimum: 0}
            la: {type: integer, minimum: 0}
            ld: {type: integer, minimum: 0}
          required: [ns, nd, nf, ent, la, ld]
          additionalProperties: false
      required: [rawRows, includedRows, positiveLabels, blankLabels, excluded, featureMissing]
      additionalProperties: false
    CurrentSource:
      type: object
      properties:
        publisher: {type: string, minLength: 1}
        revision: {type: string, minLength: 1}
        url: {type: string, format: uri, pattern: '^https://'}
        sha256: {$ref: '#/components/schemas/Hash'}
        citation: {type: string, minLength: 1}
        labelRule: {type: string, minLength: 1}
        files:
          type: object
          properties:
            openstack.csv: {$ref: '#/components/schemas/SourceFile'}
            load_data.r: {$ref: '#/components/schemas/SourceFile'}
            experimental_settings.r: {$ref: '#/components/schemas/SourceFile'}
          required: [openstack.csv, load_data.r, experimental_settings.r]
          additionalProperties: false
        quality: {$ref: '#/components/schemas/CurrentQuality'}
      required: [publisher, revision, url, sha256, citation, labelRule, files, quality]
      additionalProperties: false
    Cohort:
      type: object
      properties:
        startEpochInclusive: {type: integer, minimum: 0}
        endEpochExclusive: {type: integer, minimum: 0}
        addedLinesGreaterThan: {type: integer, minimum: 0}
        maxChurnInclusive: {type: integer, minimum: 0}
        maxFilesInclusive: {type: integer, minimum: 0}
      required: [startEpochInclusive, endEpochExclusive, addedLinesGreaterThan, maxChurnInclusive, maxFilesInclusive]
      additionalProperties: false
    SplitPart:
      type: object
      properties:
        count: {type: integer, minimum: 0}
        positiveCount: {type: integer, minimum: 0}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
      required: [count, positiveCount, start, end]
      additionalProperties: false
    BaselineSummary:
      type: object
      properties:
        runId: {$ref: '#/components/schemas/Hash'}
        datasetVersion: {type: string, minLength: 1}
        modelSha256: {$ref: '#/components/schemas/Hash'}
        features:
          const: [ns, nd, nf, ent, la, ld]
        threshold: {const: 0.5}
